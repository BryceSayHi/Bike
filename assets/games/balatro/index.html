<!doctype html>
<html lang="en-us">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width,user-scalable=no">
    <title>Balatro</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="spinner" class="pending"></div>

    <script>
      function mergeFiles(fileParts) {
        return new Promise((resolve, reject) => {
          let buffers = [];

          function fetchPart(index) {
            if (index >= fileParts.length) {
              let mergedBlob = new Blob(buffers);
              let mergedFileUrl = URL.createObjectURL(mergedBlob);
              resolve(mergedFileUrl);
              return;
            }
            fetch(fileParts[index]).then((response) => {
              if (!response.ok) throw new Error('Fetch failed: ' + fileParts[index]);
              return response.arrayBuffer();
            }).then((data) => {
              buffers.push(data);
              fetchPart(index + 1);
            }).catch(reject);
          }
          fetchPart(0);
        });
      }

      function getParts(fileBase, start, end) {
        const parts = [];
        for (let i = start; i <= end; i++) {
          // relative filenames in same folder as index.html
          parts.push(`${fileBase}.part${i}`);
        }
        return parts;
      }

      mergeFiles(getParts("balatro", 1, 3)).then(url => {
        let player = document.createElement("script");
        player.src = "player.js?g=" + encodeURIComponent(url);
        document.body.appendChild(player);
      }).catch(err => {
        console.error('Could not load parts:', err);
        document.getElementById('spinner').classList.remove('pending');
        // show fallback UI if desired
      });
    </script>
  </body>
</html>
