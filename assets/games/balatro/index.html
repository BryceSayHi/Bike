<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Balatro</title>
  <meta name="viewport" content="width=device-width, user-scalable=no">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #canvas { width: 100%; height: 100%; display: block; }
    #spinner.pending::after {
      content: "Loading…";
      font-family: sans-serif;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="spinner" class="pending"></div>

  <script>
    async function mergeFiles(partFiles) {
      const buffers = [];
      for (const file of partFiles) {
        const res = await fetch(file);
        if (!res.ok) throw new Error("Failed to fetch " + file);
        buffers.push(await res.arrayBuffer());
      }
      return URL.createObjectURL(new Blob(buffers));
    }

    function getParts(base, start, end) {
      const parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(`${base}.p${i}`);  // .p1, .p2, .p3
      }
      return parts;
    }

    mergeFiles(getParts("balatro", 1, 3)).then(url => {
      const player = document.createElement("script");
      player.src = "player.js?g=" + encodeURIComponent(url);
      document.body.appendChild(player);
    }).catch(err => {
      console.error("Failed to load game:", err);
      document.getElementById("spinner").textContent = "Failed to load game.";
    });
  </script>
</body>
</html>
